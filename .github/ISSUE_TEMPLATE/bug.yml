name: Bug report
description: Report a reproducible problem in the code or figures
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command that failed
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error
      description: Traceback or unexpected output
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag or commit SHA
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
