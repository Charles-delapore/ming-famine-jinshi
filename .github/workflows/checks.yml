name: Public checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn statsmodels shapely tqdm matplotlib pytest pyyaml ruff openpyxl folium branca pytest-cov

      - name: lint
        run: ruff check .

      - name: check the public tree
        run: python tools/check_public_tree.py

      - name: check documentation links
        run: python tools/check_docs_links.py

      - name: check figure hashes
        run: python tools/check_figure_hashes.py

      - name: run tests
        run: pytest -q --cov=src --cov=tools --cov-report=term-missing --cov-report=xml

      - name: check release metadata
        run: python tools/check_release.py

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml









