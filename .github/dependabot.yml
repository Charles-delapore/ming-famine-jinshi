version: 2
updates:
  # Routine pip update PRs are disabled: grouped minimum-version bumps raise
  # numpy/pandas to releases that drop Python 3.9/3.10 support. Review the
  # analysis stack manually when a security advisory or a needed feature appears.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - "dependencies"
