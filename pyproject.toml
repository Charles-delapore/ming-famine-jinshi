[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["data", "output", "figures", ".git", "_internal"]

[tool.ruff.lint]
# Start with correctness-only rules: syntax errors, undefined names and
# invalid comparisons. Style rules can be added once the baseline is clean.
select = ["E9", "F63", "F7", "F82"]
